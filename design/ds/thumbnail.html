<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Beat Upload</title><link rel="stylesheet" href="styles.css">
<style>body{display:grid;place-items:center;height:100vh}.t{width:560px;padding:40px;border:2px solid var(--color-divider);display:flex;flex-direction:column;gap:24px}.sw{display:grid;grid-template-columns:repeat(6,1fr);height:28px}</style></head>
<body><div class="t">
<div class="display" style="font-size:56px">Beat<span class="text-accent">.</span>Upload</div>
<div class="sw"><div style="background:var(--color-bg);border:1px solid var(--color-divider)"></div><div style="background:var(--color-surface)"></div><div style="background:var(--color-surface-2)"></div><div style="background:var(--color-text)"></div><div style="background:var(--color-accent)"></div><div style="background:var(--color-accent-900)"></div></div>
<div class="row" style="display:flex;gap:6px"><span class="tag tag-outline">Draft</span><span class="tag tag-accent">● Rendering</span><span class="tag tag-ink">Published</span><span class="tag tag-failed">Failed</span></div>
<div class="text-muted" style="font-size:12px">Dark ground · Archivo · radius 0 · rules 2px · one red</div>
</div></body></html>
