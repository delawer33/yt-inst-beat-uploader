<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Beat Upload · Effect render</title>
<style>
  @font-face { font-family: "League Gothic"; src: url("../fonts/LeagueGothic-Regular.ttf"); font-weight: 400; }
  @font-face { font-family: "IBM Plex Mono"; src: url("../fonts/IBMPlexMono-Regular.ttf"); font-weight: 400; }
  @font-face { font-family: "IBM Plex Mono"; src: url("../fonts/IBMPlexMono-SemiBold.ttf"); font-weight: 600; }
  body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
// The Render's side of the engine (beat_upload/visual/render.py drives it): the engine and
// the effects are added as script tags by Python, then __render.setup() once and
// __render.batch(features[], clipFrames[]) per batch of frames: every frame of the batch is
// drawn, encoded to JPEG and the lot is POSTed, binary, to /frames of the server that serves
// this page (render.py's _FrameServer), so no frame travels over Playwright's channel.
// The engine draws straight at the file's size (setFormat(format, scale), scale 2 = 1080p).
// `clipFrames[i]` is a data URL of the Clip's frame for frame i (or null); the Effect's
// `clip` field says whether it plays on under the Effect ('live') or stands still between cuts.
(function () {
  'use strict';
  function mulberry32(seed) { let a = seed >>> 0; return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const stage = document.getElementById('stage');
  let quality = 0.92;
  function loadImage(src) { return new Promise((ok, err) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => err(new Error('image did not load')); im.src = src; }); }
  function toBlob(canvas) { return new Promise((ok, err) => canvas.toBlob(b => b ? ok(b) : err(new Error('frame did not encode')), 'image/jpeg', quality)); }
  function base64Of(blob) { return new Promise((ok, err) => { const r = new FileReader(); r.onload = () => ok(r.result.slice(r.result.indexOf(',') + 1)); r.onerror = () => err(r.error); r.readAsDataURL(blob); }); }
  window.__render = {
    async setup(o) {
      Math.random = mulberry32(o.seed || 1);
      await Promise.all([document.fonts.load('100px "League Gothic"'), document.fonts.load('600 14px "IBM Plex Mono"'), document.fonts.load('400 14px "IBM Plex Mono"')]);
      const E = window.BeatVisual; E.attach(stage);
      Object.assign(E.meta, o.meta || {}); Object.assign(E.knobs, o.knobs || {});
      quality = o.quality || 0.92;
      E.setFormat(o.format || 'reel', o.scale || 2);
      E.setCover(await loadImage(o.cover));
      E.setPal(o.palette); E.pick(o.effect);
      if (o.clip) { E.video.mode = (E.current && E.current.clip) || 'live'; E.video.lastNext = null; }
      return { W: E.W, H: E.H, effect: E.current && E.current.id, styles: E.STYLES.map(s => s.id), clip: o.clip ? E.video.mode : null };
    },
    async batch(frames, clipFrames) {
      const E = window.BeatVisual, parts = [];
      for (let i = 0; i < frames.length; i++) {
        const cf = clipFrames && clipFrames[i]; if (cf) E.setClipFrame(await loadImage(cf));
        E.renderFrame(frames[i]); parts.push(await toBlob(stage)); // one at a time: parallel toBlob calls were slower
      }
      const body = new Blob(parts, { type: 'application/octet-stream' });
      const r = await fetch('/frames', { method: 'POST', body });
      return { frames: parts.length, bytes: body.size, posted: r.ok };
    },
  };
})();
</script>
</body>
</html>
