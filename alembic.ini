# Alembic CLI config for developers (``alembic revision --autogenerate -m "..."``).
# At runtime the server applies migrations itself via beat_server.db.migrate.upgrade_to_head,
# which points at the same script_location and at the Workspace database.
[alembic]
script_location = beat_server/db/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url = sqlite:///dev.sqlite3

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
